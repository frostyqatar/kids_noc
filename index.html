<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>North Oil Company for Kids</title>
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;800&display=swap">
<style>
:root{
  --ink:#12324A;--muted:#48677D;--panel:#FFFFFF;--panel-2:#EAF7FA;--edge:#12324A;--drop:#12324A;
  --hi:#C24E00;--sun-soft:#FFF1C7;--sea-soft:#BFE9F0;--land:#F2D49B;--land-edge:#C9A469;
  --orange:#FF7A1A;--sun:#FFC83D;--teal:#1BA9B5;--deep:#0B3A5B;--maroon:#8A1538;--good:#1F9D55;--bad:#D93F44;
  --bgf:none;--sx:1;
  --font:"Baloo Bhaijaan 2","Segoe UI",Tahoma,"Geeza Pro","Noto Sans Arabic",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#EAF6FB;--muted:#A9C7D8;--panel:#10273A;--panel-2:#17354C;--edge:#4A7FA3;--drop:#02090F;--hi:#FFB070;--sun-soft:#3A3116;--sea-soft:#174A63;--land:#9C8052;--land-edge:#6E5832;--bgf:brightness(.68) saturate(.9);color-scheme:dark}
}
:root[data-theme="dark"]{--ink:#EAF6FB;--muted:#A9C7D8;--panel:#10273A;--panel-2:#17354C;--edge:#4A7FA3;--drop:#02090F;--hi:#FFB070;--sun-soft:#3A3116;--sea-soft:#174A63;--land:#9C8052;--land-edge:#6E5832;--bgf:brightness(.68) saturate(.9);color-scheme:dark}
:root[dir="rtl"]{--sx:-1}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--deep);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
svg{direction:ltr}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--teal);outline-offset:3px}

/* depth journey background */
.depth{position:fixed;inset:0;overflow:hidden;z-index:0;filter:var(--bgf)}
.depth-in{position:absolute;left:0;right:0;top:0;height:400%;--d:0;transform:translateY(calc(var(--d) * -75%));transition:transform 1.4s cubic-bezier(.65,0,.25,1);
  background:linear-gradient(180deg,#7fd3f0 0%,#d6f2fb 13.8%,#2ab7c6 14%,#138aa8 24%,#0c5f86 32%,#083f5e 39.6%,#e3c28b 40%,#cfa56b 43.8%,#b98a5e 44%,#b98a5e 50%,#a0714a 50%,#a0714a 56%,#c49a6c 56%,#c49a6c 63%,#8e6240 63%,#8e6240 71.8%,#3a2718 72%,#1f140d 80%,#6b4a33 80%,#4a3222 100%)}
.sunb{position:absolute;top:2.5%;right:12%;width:clamp(60px,9vw,110px);aspect-ratio:1;border-radius:50%;background:#FFD55A;box-shadow:0 0 0 14px rgba(255,213,90,.35)}
.wave{position:absolute;left:0;width:100%;top:calc(14% - 14px);height:16px;display:block}

/* app shell */
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;transition:opacity .36s cubic-bezier(.4,0,.2,1),transform .36s cubic-bezier(.4,0,.2,1),filter .36s cubic-bezier(.4,0,.2,1)}
.app.swap{opacity:0;transform:translateY(12px) scale(.994);filter:blur(8px);will-change:opacity,transform,filter}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px clamp(10px,2vw,20px) 4px}
.brand{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--edge);border-radius:999px;padding-block:4px;padding-inline:8px 16px;font-weight:800;font-size:clamp(.95rem,1.6vw,1.15rem);box-shadow:calc(var(--sx)*3px) 3px 0 var(--drop)}
.brand svg{width:24px;height:30px}
.tools{display:flex;gap:8px}
.pill{background:var(--panel);border:3px solid var(--edge);border-radius:999px;padding:4px 16px;font-weight:800;cursor:pointer;box-shadow:calc(var(--sx)*3px) 3px 0 var(--drop);min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill:active{transform:translate(calc(var(--sx)*2px),2px);box-shadow:calc(var(--sx)*1px) 1px 0 var(--drop)}
.stage{position:relative;flex:1;min-height:0}
.slide{position:absolute;inset:0;display:flex;overflow-y:auto;overflow-x:hidden;padding:10px clamp(10px,2.4vw,28px) 18px;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity .35s,transform .35s,visibility 0s .35s}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity .45s .2s,transform .45s .2s,visibility 0s}
@media (min-width:900px){.slide{padding-inline-end:110px}}
.panel{margin:auto;width:100%;max-width:1120px;background:var(--panel);border:3px solid var(--edge);border-radius:34px;box-shadow:calc(var(--sx)*9px) 9px 0 var(--drop);padding:clamp(18px,3.4vw,44px)}

/* type */
h1,h2{font-weight:800;line-height:1.08;margin:0 0 .35em;text-wrap:balance}
h1{font-size:clamp(2.1rem,5.2vw,4rem)}
h2{font-size:clamp(1.8rem,4.2vw,3.1rem)}
h3{font-size:clamp(1.25rem,2.2vw,1.6rem);margin:.8em 0 .35em;font-weight:800}
:root[lang="ar"] h1,:root[lang="ar"] h2{line-height:1.35}
p{font-size:clamp(1.15rem,2.05vw,1.55rem);line-height:1.45;margin:0 0 .65em}
:root[lang="ar"] p{line-height:1.75}
b{color:var(--hi);font-weight:800}
.lead{max-width:30em}
.center{text-align:center}

.two{display:grid;gap:clamp(18px,3vw,40px);align-items:center}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr}}
.art{width:100%;height:auto;display:block;border-radius:24px;border:3px solid var(--edge);overflow:hidden}

.btn{border:3px solid var(--edge);border-radius:999px;padding:.35em 1.3em;background:var(--sun);color:#12324A;font-weight:800;font-size:clamp(1.1rem,1.9vw,1.35rem);cursor:pointer;box-shadow:calc(var(--sx)*4px) 4px 0 var(--drop);min-height:50px;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(calc(var(--sx)*3px),3px);box-shadow:calc(var(--sx)*1px) 1px 0 var(--drop)}

/* title */
.hero-art{position:relative}
.hero-art .qatra{position:absolute;width:34%;right:-3%;bottom:-8%;animation:bob 2.6s ease-in-out infinite;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.22))}
@keyframes bob{50%{transform:translateY(-9px)}}

/* partners cake */
.cake{width:min(280px,64vw);aspect-ratio:1;border-radius:50%;border:4px solid var(--edge);margin:0 auto;background:repeating-conic-gradient(var(--edge) 0 1.4deg,transparent 1.4deg 36deg),conic-gradient(var(--maroon) 0 70%,var(--sun) 0 100%);box-shadow:calc(var(--sx)*6px) 6px 0 var(--drop)}
.legend{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.legend li{display:flex;align-items:center;gap:12px;font-size:clamp(1.1rem,1.9vw,1.4rem)}
.chip{width:30px;height:30px;border-radius:9px;border:3px solid var(--edge);flex:none}

/* map */
.map{max-width:380px;margin:0 auto}
.map .sea{fill:var(--sea-soft)}
.map .land{fill:var(--land);stroke:var(--land-edge);stroke-width:3;stroke-linejoin:round}
.map .land2{fill:var(--land);opacity:.5}
.map .route{stroke:var(--ink);stroke-width:3;stroke-dasharray:7 7;fill:none}
.map .dot{fill:var(--ink)}
.map text{fill:var(--ink);font-family:var(--font);font-weight:800;font-size:17px}
.map .country{fill:var(--muted);font-size:30px}
.map .pin{fill:var(--orange);stroke:var(--edge);stroke-width:3}
.map .ring{fill:none;stroke:var(--orange);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:1}to{transform:scale(2);opacity:0}}

/* helicopter scene + jobs */
.heli{transform:translate(50px,78px)}
.slide.on .heli{animation:fly 3.2s cubic-bezier(.25,.6,.3,1) both}
@keyframes fly{0%{transform:translate(370px,8px)}75%{transform:translate(50px,58px)}100%{transform:translate(50px,78px)}}
.rotor{transform-box:fill-box;transform-origin:center;animation:spin .18s linear 24 alternate}
@keyframes spin{to{transform:scaleX(.2)}}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:1000px){.jobs{grid-template-columns:repeat(3,1fr)}}
.job{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:18px;padding:8px 12px;font-size:clamp(.98rem,1.5vw,1.12rem);line-height:1.3}
.job .e{font-size:1.9rem;flex:none}

/* safety dress-up */
.dress{width:min(230px,52vw);margin:0 auto;display:block;overflow:visible;animation:bob 3s ease-in-out infinite}
.gear{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .25s,transform .4s cubic-bezier(.3,1.7,.5,1)}
.dress.g-hat .gear-hat,.dress.g-glasses .gear-glasses,.dress.g-ears .gear-ears,.dress.g-vest .gear-vest,.dress.g-gloves .gear-gloves,.dress.g-boots .gear-boots{opacity:1;transform:none}
.gears{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative}
.tap-hint{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:-58px;display:flex;flex-direction:column;align-items:center;pointer-events:none;z-index:5;font-family:var(--font)}
.tap-hint .finger{font-size:2rem;line-height:1;animation:bounce 1.1s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tap-hint .ripple{position:absolute;left:calc(50% - 11px);bottom:-4px;width:22px;height:22px;border:2px solid var(--orange);border-radius:50%;animation:expand 1.1s ease-out infinite}
.tap-hint .tap-label{background:var(--edge);color:var(--panel);border-radius:999px;padding:1px 10px;font-weight:800;font-size:.85rem;line-height:1.3;white-space:nowrap}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(10px)}}
@keyframes expand{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.9);opacity:0}}
.gears.tapped .tap-hint{display:none}
.gbtn{position:relative;background:var(--panel-2);border:3px solid var(--edge);border-radius:20px;padding:8px 6px;font-weight:800;font-size:clamp(.92rem,1.5vw,1.1rem);cursor:pointer;line-height:1.2;min-height:84px;box-shadow:calc(var(--sx)*3px) 3px 0 var(--drop)}
.gbtn .e{display:block;font-size:2rem;line-height:1.25}
.gbtn[aria-pressed="true"]{background:var(--good);color:#fff}
.gstat{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;margin:12px 0 0;font-weight:800;font-size:clamp(1.05rem,1.8vw,1.3rem);min-height:1.6em}
#gdone{color:var(--good)}
.callout{background:var(--sun-soft);border:3px dashed var(--edge);border-radius:22px;padding:12px 18px;margin-top:16px}
.callout p{margin:0}

/* let's drill (inline mini-game) */
.dtop{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;margin-bottom:4px}
.dtop h2{margin:0}
.dchips{list-style:none;display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0}
.dchips li{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border:2px solid var(--edge);border-radius:999px;padding:2px 12px 2px 3px;font-weight:800;font-size:clamp(.78rem,1.3vw,.98rem);opacity:.5;transition:opacity .25s,background .25s,color .25s,border-color .25s}
.dchips li i{display:grid;place-items:center;width:1.7em;height:1.7em;border-radius:50%;background:var(--sun-soft);font-style:normal;font-size:.82em}
.dchips li.on{opacity:1;background:var(--sun-soft)}
.dchips li.on i{background:var(--orange);color:#fff}
.dchips li.done{opacity:1;background:var(--good);color:#fff;border-color:var(--good)}
.dchips li.done i{background:rgba(255,255,255,.28);color:#fff}
.dwrap{position:relative;border:3px solid var(--edge);border-radius:24px;overflow:hidden;background:#0B3A55;height:clamp(300px,50vh,500px);box-shadow:inset 0 0 0 3px rgba(255,255,255,.16)}
#dworld{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.dgauge{position:absolute;top:10px;inset-inline-start:12px;display:flex;align-items:baseline;gap:5px;background:rgba(6,42,64,.8);border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:2px 12px;color:#EAF6FB;font-weight:800;font-size:clamp(.8rem,1.3vw,1rem);opacity:0;transition:opacity .3s;pointer-events:none;z-index:3}
.dgauge.show{opacity:1}
.dgauge b{font-size:1.45em}
.dbanner{position:absolute;inset:0;display:grid;place-items:end center;padding:0 12px 14px;background:radial-gradient(80% 80% at 50% 40%,rgba(6,42,64,.04),rgba(6,42,64,.5));opacity:0;pointer-events:none;transition:opacity .35s;z-index:4}
.dbanner.show{opacity:1;pointer-events:auto}
.dbcard{background:var(--panel);border:3px solid var(--edge);border-radius:22px;box-shadow:calc(var(--sx)*6px) 6px 0 var(--drop);padding:12px 22px 16px;text-align:center;max-width:88%}
.dbcard h3{margin:0;color:var(--hi);font-size:clamp(1.15rem,2.6vw,1.9rem)}
.dbcard button{margin-top:10px}
.dhud{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.dprompt{flex:1 1 210px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:clamp(1rem,1.7vw,1.3rem);min-width:0}
.dprompt .arrow{color:var(--orange);flex:none;animation:bounce 1.1s ease-in-out infinite}
.dprompt .arrow.up{animation-name:bounceUp}
@keyframes bounceUp{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.dslider{position:relative;flex:2 1 300px;min-width:200px;height:54px;border:3px solid var(--edge);border-radius:999px;background:repeating-linear-gradient(90deg,var(--panel-2) 0 16px,rgba(18,50,74,.08) 16px 32px);box-shadow:inset 0 2px 6px rgba(18,50,74,.18);direction:ltr;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.dslider.locked{filter:grayscale(.55) opacity(.55);pointer-events:none}
.dslider.dragging{cursor:grabbing}
.dfill{position:absolute;left:5px;top:5px;bottom:5px;width:0;border-radius:999px;background:linear-gradient(90deg,var(--sun),var(--orange));box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.dfill i{position:absolute;right:-7px;top:50%;width:15px;height:15px;margin-top:-7.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF6D8,#FFC83D);opacity:0}
.dslider.working .dfill i{opacity:1;animation:dgBub 1.4s linear infinite}
.dslider.working .dfill i:nth-child(2){animation-delay:.7s}
@keyframes dgBub{0%{transform:translateY(0) scale(.7);opacity:.9}100%{transform:translateY(-46px) scale(1.1);opacity:0}}
.dknob{position:absolute;left:26px;top:50%;width:46px;height:46px;margin-top:-23px;margin-left:-23px;border-radius:50%;border:3px solid var(--edge);background:radial-gradient(circle at 34% 28%,#FFC98B,var(--orange) 62%,#A83E07);box-shadow:0 .18em 0 var(--drop),inset 0 -.25em .45em rgba(0,0,0,.25);display:grid;place-items:center;color:#fff;pointer-events:none;z-index:2}
.dknob svg{width:56%;height:56%}
.dslider.ready .dknob{animation:dgKnob 1.7s ease-out infinite}
@keyframes dgKnob{0%{box-shadow:0 .18em 0 var(--drop),0 0 0 0 rgba(232,100,26,.5)}100%{box-shadow:0 .18em 0 var(--drop),0 0 0 18px rgba(232,100,26,0)}}
.dfoot{flex:none;background:var(--sun);border:2px solid var(--edge);border-radius:999px;padding:4px 14px;font-weight:800;font-size:clamp(.82rem,1.4vw,1.05rem);box-shadow:calc(var(--sx)*3px) 3px 0 var(--drop);opacity:0;transition:opacity .25s}
.dfoot.show{opacity:1}
#dworld .dcloud{animation:dgDrift 46s ease-in-out infinite alternate}
@keyframes dgDrift{from{transform:translateX(-26px)}to{transform:translateX(34px)}}
#dworld .dblink{animation:dgBlink 1.4s steps(1,end) infinite}
@keyframes dgBlink{50%{opacity:.15}}
#dbitSpin{transform-box:fill-box;transform-origin:center}
#dworld.drilling #dbitSpin{animation:dgSpin .34s linear infinite}
@keyframes dgSpin{to{transform:rotate(360deg)}}
#dworld.drilling #dstringT{animation:dgPipeSpin .3s linear infinite}
@keyframes dgPipeSpin{to{stroke-dashoffset:-29}}
#dworld.drilling #dblockG{animation:dgBlockBob .16s linear infinite alternate}
@keyframes dgBlockBob{from{transform:translateY(-2.5px)}to{transform:translateY(3.5px)}}
#dworld.drilling #drotary{animation:dgRotSpray .5s linear infinite}
@keyframes dgRotSpray{to{stroke-dashoffset:-32}}
#dworld .dglint{animation:dgTwinkle 2.4s ease-in-out infinite}
@keyframes dgTwinkle{50%{opacity:.12}}
#dworld .dstreak{animation:dgFlow 1.1s linear infinite}
@keyframes dgFlow{to{stroke-dashoffset:-66}}
#dworld .dray{animation:dgSway 11s ease-in-out infinite alternate}
@keyframes dgSway{from{transform:translateX(-16px)}to{transform:translateX(20px)}}
#dworld #dcaustics{animation:dgCaustic 13s linear infinite}
@keyframes dgCaustic{from{transform:translateX(0)}to{transform:translateX(220px)}}
#dworld .dsnow{animation:dgSnow 9s ease-in-out infinite alternate}
@keyframes dgSnow{from{transform:translateY(-10px)}to{transform:translateY(16px)}}
#dworld .dfish1{animation:dgFish1 11s ease-in-out infinite}
@keyframes dgFish1{0%{transform:translateX(0) scaleX(1)}44%{transform:translateX(300px) scaleX(1)}50%{transform:translateX(300px) scaleX(-1)}94%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
#dworld .dfish2{animation:dgFish2 14s ease-in-out -5s infinite}
@keyframes dgFish2{0%{transform:translateX(0) scaleX(-1)}44%{transform:translateX(-240px) scaleX(-1)}50%{transform:translateX(-240px) scaleX(1)}94%{transform:translateX(0) scaleX(1)}100%{transform:translateX(0) scaleX(-1)}}
#dworld .dfish3{animation:dgFish3 12s ease-in-out -8s infinite}
@keyframes dgFish3{0%{transform:translateX(0) scaleX(-1)}44%{transform:translateX(-260px) scaleX(-1)}50%{transform:translateX(-260px) scaleX(1)}94%{transform:translateX(0) scaleX(1)}100%{transform:translateX(0) scaleX(-1)}}
#dflywheel{transform-box:fill-box;transform-origin:center}
#dworld.lifting #dflywheel{animation:dgSpin .45s linear infinite}
#dworld .drip{animation:dgRipple 3.2s ease-out infinite}
@keyframes dgRipple{0%{transform:scale(.75);opacity:.55}100%{transform:scale(1.6);opacity:0}}
#dworld .drip.off{animation:none;opacity:0}
#dworld #dhose{opacity:0;transition:opacity .5s}
#dworld #dhose.on{opacity:1}
#dworld #dhose.on #dhoseFlow{animation:dgHoseFlow .8s linear infinite}
@keyframes dgHoseFlow{to{stroke-dashoffset:-26}}
#dworld .dsteam circle{opacity:0;animation:dgPuff 3.8s ease-out infinite}
#dworld .dsteam circle:nth-child(2){animation-delay:1.3s}
#dworld .dsteam circle:nth-child(3){animation-delay:2.6s}
@keyframes dgPuff{0%{transform:translate(0,0) scale(.6);opacity:.5}100%{transform:translate(7px,-24px) scale(1.5);opacity:0}}
#drefLabel{transition:opacity .8s}
#drefLabel.on{opacity:1}
#dworld #ddepthTag{transition:opacity .3s;pointer-events:none}
#dworld #dradar{transform-box:fill-box;transform-origin:center}
#dworld #dship.sailing #dradar{animation:dgSpin 2.2s linear infinite}
#dworld #dship.sailing #dbow{opacity:1}
#dworld .dsmoke circle{opacity:0}
#dworld #dship.sailing .dsmoke circle{animation:dgPuff 2.6s ease-out infinite}
#dworld #dship.sailing .dsmoke circle:nth-child(2){animation-delay:.9s}
#dworld #dship.sailing .dsmoke circle:nth-child(3){animation-delay:1.8s}
#dglabels{opacity:0;transition:opacity .55s}
#dglabels.on{opacity:1}
.dlbl{fill:#EAF6FB;opacity:.72;font-family:var(--font);font-weight:800;font-size:21px;letter-spacing:2px;paint-order:stroke;stroke:rgba(6,42,64,.6);stroke-width:5px;stroke-linejoin:round}
:root[lang="ar"] .dlbl,:root[lang="ar"] #dgasLbl,:root[lang="ar"] #doilLbl text{letter-spacing:0!important}
@media (max-width:620px){.dfoot{display:none}}

/* platform scene */
.f1{animation:sw1 16s linear infinite}
.f2{animation:sw2 22s linear -9s infinite}
@keyframes sw1{from{transform:translate(440px,170px)}to{transform:translate(-40px,170px)}}
@keyframes sw2{from{transform:translate(440px,262px)}to{transform:translate(-40px,262px)}}
.scene text{font-family:var(--font);font-weight:800;font-size:15px}

/* oil formation steps */
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:18px}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{position:relative;background:var(--panel-2);border:3px solid var(--edge);border-radius:26px;padding:18px 18px 16px}
.step .e{font-size:2.8rem;display:block;line-height:1.15;margin-bottom:6px}
.step .n{position:absolute;top:-16px;inset-inline-start:-10px;width:42px;height:42px;border-radius:50%;background:var(--orange);color:#fff;border:3px solid var(--edge);display:grid;place-items:center;font-weight:800;font-size:1.25rem}
.step p{font-size:clamp(1.05rem,1.7vw,1.3rem);margin:0}

/* drilling */
.drill #well{fill:none;stroke:#FFC83D;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.drill #bit{fill:#FF7A1A;stroke:#fff;stroke-width:3}
.drill text{font-family:var(--font);font-weight:800;font-size:18px}
#found{opacity:0;transition:opacity .4s;fill:#FFC83D;stroke:#2B1E16;stroke-width:5;paint-order:stroke;font-size:26px}
#found.show{opacity:1}
#oilL.glow{animation:glow 1.1s ease-in-out 3}
@keyframes glow{50%{fill:#7A4C22}}

/* how much */
.about{font-weight:800;font-size:clamp(1.1rem,2vw,1.5rem);color:var(--muted)}
.big{font-size:clamp(3rem,10vw,6.2rem);font-weight:800;line-height:1;color:var(--hi);font-variant-numeric:tabular-nums}
.unit{font-weight:800;font-size:clamp(1.2rem,2.2vw,1.7rem);margin-top:4px}
.pools{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:clamp(1.7rem,3.2vw,2.4rem);margin:0 0 12px;justify-content:center}
.pool{display:inline-block}
.slide.on .pool{animation:pop .45s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--i) * 70ms + .4s)}
@keyframes pop{from{transform:scale(0);opacity:0}}

/* oil in things */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--panel-2);border:3px solid var(--edge);border-radius:22px;padding:12px 8px;cursor:pointer;text-align:center;box-shadow:calc(var(--sx)*3px) 3px 0 var(--drop);min-height:132px}
.tile .e{display:block;font-size:2.6rem;line-height:1.2}
.tile .nm{display:block;font-weight:800;font-size:clamp(1rem,1.6vw,1.2rem)}
.tile .rv{display:block;font-size:clamp(.92rem,1.4vw,1.05rem);color:var(--hi);font-weight:800;visibility:hidden;min-height:1.4em}
.tile[aria-pressed="true"]{background:var(--sun-soft)}
.tile[aria-pressed="true"] .rv{visibility:visible}
.tile.wig{animation:wig .5s}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* prize questions — compact, no scrolling */
.qpanel{text-align:center;padding:clamp(12px,2.2vw,26px)}
.qhead{display:flex;flex-direction:column;align-items:center;gap:2px}
.qtag{display:inline-block;background:var(--maroon);color:#fff;border:3px solid var(--edge);border-radius:999px;padding:1px 14px;font-weight:800;font-size:clamp(.82rem,1.4vw,1.05rem)}
.qrule{font-weight:800;color:var(--muted);margin:0;font-size:clamp(.85rem,1.3vw,1rem)}
.qbig{font-size:clamp(1.5rem,3.6vw,2.7rem);margin:.2em 0 .05em}
.qemo{font-size:clamp(2rem,4.8vw,3.2rem);line-height:1.1}
.qemo .post,.qslide.revealed .qemo .pre{display:none}
.qslide.revealed .qemo .post{display:inline}
.qbtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 2px}
.qbtns .btn{min-height:44px;font-size:clamp(1rem,1.6vw,1.15rem);padding:.3em 1.1em}
.btn.alt{background:var(--panel-2);color:var(--ink)}
.hint,.ans{display:none;margin:10px auto 0;max-width:820px;border:3px solid var(--edge);border-radius:20px;padding:10px 16px}
.hint{background:var(--panel-2);border-style:dashed}
.hint p{margin:0;font-size:clamp(.9rem,1.4vw,1.05rem)}
.ans{background:var(--sun-soft)}
.qslide.hinted .hint{display:block}
.qslide.revealed .hint{display:none}
.qslide.revealed .ans{display:block;animation:pop .5s cubic-bezier(.3,1.7,.5,1) both}
.ans h3{font-size:clamp(1.1rem,2.3vw,1.6rem);color:var(--hi);margin:.05em 0 .2em;line-height:1.2}
.ans p{font-size:clamp(.88rem,1.3vw,1.05rem);line-height:1.4;margin:0 auto .3em;max-width:46em}
.ans p:last-child{margin-bottom:0}
@media (max-height:700px){
  .qemo{font-size:clamp(1.5rem,3.4vw,2.1rem)}
  .qbig{font-size:clamp(1.25rem,2.9vw,2rem)}
  .qbtns{margin:6px 0 2px}
  .hint,.ans{padding:8px 14px;margin-top:8px}
}
@media (max-height:560px){
  .qemo{display:none}
  .ans p,.hint p{font-size:.82rem}
}
@media (min-width:1600px) and (min-height:860px){html{font-size:125%}.panel{max-width:1440px}}

/* finale */
.qatra-big{width:min(300px,58vw);margin:0 auto;display:block;animation:bob 2.4s ease-in-out infinite}

/* Qatra narrator */
.panel{position:relative}
.qanchor{position:relative}
.qanchor--map{width:min(380px,100%);margin-inline:auto}
.qhost{position:absolute;z-index:6;pointer-events:none}
.qhost--new{width:clamp(54px,6.6vw,92px)}
.qhost--q.qhost--new{width:clamp(42px,5.4vw,70px)}
.qhost--mid{left:50%;top:50%;transform:translate(-50%,-50%)}
.qhost .qsvg{width:100%;height:auto;display:block;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.22));animation:qfloat 2.8s ease-in-out infinite}
.qhost--slide .qsvg{animation:none} /* the whole host floats so she keeps bobbing even while talking */
.qhost--slide{transition:left .55s cubic-bezier(.34,1.12,.4,1),top .55s cubic-bezier(.34,1.12,.4,1);animation:bob 2.6s ease-in-out infinite}
/* fade her in during the skim pause, floating, instead of popping in */
.qhost--slide.enter{animation:qatraEnter 1.2s ease both,bob 2.6s ease-in-out infinite}
@keyframes qatraEnter{from{opacity:0}}
/* the sentence Qatra is explaining */
.qatrah{position:relative;background-color:rgba(255,200,61,.26);border-radius:10px;animation:qatraIn .6s ease-out both,qatraPulse 1.8s ease-in-out .6s infinite}
.qatrah::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:6px;border-radius:999px;background:linear-gradient(90deg,var(--sun),var(--orange));transform:scaleX(0);transform-origin:left center;animation:qatraBar .9s cubic-bezier(.2,.9,.3,1) .1s forwards}
:root[dir="rtl"] .qatrah::after{transform-origin:right center}
@keyframes qatraIn{from{background-color:transparent}}
@keyframes qatraPulse{50%{background-color:rgba(255,200,61,.44)}}
@keyframes qatraBar{to{transform:scaleX(1)}}
svg text.qatrah{fill:var(--orange);animation:qatraSvgPulse 1.4s ease-in-out infinite alternate}
@keyframes qatraSvgPulse{from{filter:drop-shadow(0 0 2px rgba(255,150,20,.4))}to{filter:drop-shadow(0 0 9px rgba(255,150,20,.95))}}
/* eyes: natural saccades + blinks */
.q-eye{transform-box:fill-box;transform-origin:center;animation:qblink 4.6s cubic-bezier(.4,0,.2,1) infinite}
.q-eye+.q-eye{animation-delay:.06s}
.q-pupils{transform-box:fill-box;transform-origin:center;animation:qlook 7.2s ease-in-out infinite}
@keyframes qblink{0%,90.5%,100%{transform:scaleY(1)}92.5%,96%{transform:scaleY(.06)}}
@keyframes qlook{
  0%,15%{transform:translate(0,0)}
  23%,39%{transform:translate(3.4px,.5px)}
  47%,61%{transform:translate(-3.6px,.5px)}
  71%,85%{transform:translate(0,1.6px)}
  100%{transform:translate(0,0)}
}
/* mouth: anime-style jabber — jaw hinge + shape morph + head bob */
.qm-open{opacity:0;transition:opacity .12s}
.speaking .qm-shut{opacity:0}
.speaking .qm-open{opacity:1}
.qm-jaw,.qm-shape{transform-box:fill-box}
.qm-jaw{transform-origin:50% 0}
.qm-shape{transform-origin:50% 35%}
.speaking .qm-jaw{animation:qjaw .8s cubic-bezier(.45,0,.55,1) infinite}
.speaking .qm-shape{animation:qshape 1.9s ease-in-out infinite}
.speaking .qsvg,.qatra.speaking,.qatra-big.speaking{animation:qnod 1.5s ease-in-out infinite}
@keyframes qjaw{
  0%{transform:scaleY(.18)}
  12%{transform:scaleY(1)}
  22%{transform:scaleY(.3)}
  34%{transform:scaleY(.95)}
  46%{transform:scaleY(.22)}
  58%{transform:scaleY(1.08)}
  70%{transform:scaleY(.38)}
  82%{transform:scaleY(.88)}
  92%{transform:scaleY(.28)}
  100%{transform:scaleY(.18)}
}
@keyframes qshape{
  0%{transform:scaleX(1) rotate(0deg)}
  18%{transform:scaleX(1.3) rotate(-5deg) translateX(-.6px)}
  38%{transform:scaleX(.7) rotate(4deg) translateX(.8px)}
  58%{transform:scaleX(1.16) rotate(-3deg) translateX(-.4px)}
  78%{transform:scaleX(.8) rotate(5deg) translateX(.6px)}
  100%{transform:scaleX(1) rotate(0deg)}
}
@keyframes qnod{
  0%,100%{transform:translateY(0) rotate(0deg)}
  22%{transform:translateY(-3px) rotate(-2.4deg)}
  48%{transform:translateY(1px) rotate(1.6deg)}
  72%{transform:translateY(-2px) rotate(-1.2deg)}
}
@keyframes qfloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-12px) rotate(-2deg)}
}
/* comic speech bubble */
.qbubble{position:absolute;z-index:7;width:min(250px,58vw);background:var(--panel);border:3px solid var(--edge);border-radius:16px;padding:7px 12px;box-shadow:calc(var(--sx)*4px) 4px 0 var(--drop);opacity:0;transition:opacity .22s;text-align:start}
.qbubble p{margin:0;font-size:clamp(.84rem,1.3vw,1rem);line-height:1.35;font-weight:700}
.qbubble::before,.qbubble::after{content:"";position:absolute;border:10px solid transparent}
.qbubble.on{opacity:1}
/* bubble above, tail at bottom-right (extends left) */
.qbubble.br{bottom:calc(100% + 12px);inset-inline-end:0}
.qbubble.br::after{top:100%;inset-inline-end:16px;border-top-color:var(--edge);margin-top:-1px}
.qbubble.br::before{top:calc(100% - 4px);inset-inline-end:19px;border-width:7px;border-top-color:var(--panel);z-index:1}
/* bubble above, tail at bottom-left (extends right) */
.qbubble.bl{bottom:calc(100% + 12px);inset-inline-start:0}
.qbubble.bl::after{top:100%;inset-inline-start:16px;border-top-color:var(--edge);margin-top:-1px}
.qbubble.bl::before{top:calc(100% - 4px);inset-inline-start:19px;border-width:7px;border-top-color:var(--panel);z-index:1}
/* bubble above, tail centered */
.qbubble.bc{bottom:calc(100% + 12px);left:50%;transform:translateX(-50%)}
.qbubble.bc::after{top:100%;left:50%;margin-inline-start:-10px;border-top-color:var(--edge);margin-top:-1px}
.qbubble.bc::before{top:calc(100% - 4px);left:50%;margin-inline-start:-7px;border-width:7px;border-top-color:var(--panel);z-index:1}
/* bubble below, tail at top-right */
.qbubble.bt{bottom:auto;top:calc(100% + 12px);inset-inline-end:0}
.qbubble.bt::after{bottom:100%;inset-inline-end:16px;border-bottom-color:var(--edge);margin-bottom:-1px}
.qbubble.bt::before{bottom:calc(100% - 4px);inset-inline-end:19px;border-width:7px;border-bottom-color:var(--panel);z-index:1}
.qbubble.bt.on{animation:bubInBT .34s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubInBT{from{opacity:0;transform:translate(16px,-14px) scale(.45)}}
/* bubble beside, tail points to Qatra (inline-end side) */
.qbubble.sd{top:50%;inset-inline-end:calc(100% + 12px);transform:translateY(-50%)}
.qbubble.sd::after{top:50%;inset-inline-end:-11px;transform:translateY(-50%);border:10px solid transparent;border-left-color:var(--edge)}
.qbubble.sd::before{top:50%;inset-inline-end:-6px;transform:translateY(-50%);border:7px solid transparent;border-left-color:var(--panel);z-index:1}
:root[dir="rtl"] .qbubble.sd::after{border-left-color:transparent;border-right-color:var(--edge)}
:root[dir="rtl"] .qbubble.sd::before{border-left-color:transparent;border-right-color:var(--panel)}
/* title: hero Qatra never mirrors (physical right), keep bubble anchored on the right in RTL too */
:root[dir="rtl"] .qhost--title{inset-inline-end:auto;right:11%}
:root[dir="rtl"] .qhost--title .qbubble{inset-inline-end:auto;right:0}
:root[dir="rtl"] .qhost--title .qbubble::after{inset-inline-end:auto;right:16px}
:root[dir="rtl"] .qhost--title .qbubble::before{inset-inline-end:auto;right:19px}
/* comic pop-in */
.qbubble.br.on{animation:bubInBR .34s cubic-bezier(.3,1.6,.5,1)}
.qbubble.bl.on{animation:bubInBL .34s cubic-bezier(.3,1.6,.5,1)}
.qbubble.bc.on{animation:bubInBC .34s cubic-bezier(.3,1.6,.5,1)}
.qbubble.sd.on{animation:bubInSD .34s cubic-bezier(.3,1.6,.5,1)}
@keyframes bubInBR{from{opacity:0;transform:translate(16px,14px) scale(.45)}}
@keyframes bubInBL{from{opacity:0;transform:translate(-16px,14px) scale(.45)}}
@keyframes bubInBC{from{opacity:0;transform:translateX(-50%) translateY(14px) scale(.45)}}
@keyframes bubInSD{from{opacity:0;transform:translateY(-50%) translateX(-16px) scale(.45)}}
.qfig{position:relative;display:flex;justify-content:center}
/* narrator spots — anchored to artwork / empty corners */
.qhost--cake{inset-inline-end:2%;bottom:0}
.qhost--map{inset-inline-end:4%;bottom:5%}
.qhost--heli{inset-inline-end:5%;bottom:7%}
.qhost--platform{inset-inline-end:4%;bottom:10%}
.qhost--well{inset-inline-end:17%;bottom:6%}
.qhost--sponge,.qhost--tiles{top:7%;inset-inline-end:3%}
.qhost--q{inset-inline-end:3%;bottom:6%}
.qhost--title{inset-inline-end:11%;bottom:50%;width:0}
.qhost--finale{left:50%;bottom:calc(100% - 18px);width:0}


/* nav */
.nav{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,18px);padding:6px 12px 12px}
.navbtn{min-width:52px}
.navbtn:disabled{opacity:.4;cursor:default}
.navbtn svg{width:22px;height:22px}
#next{background:var(--sun);color:#12324A}
:root[dir="rtl"] .chev{transform:scaleX(-1)}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:13px;height:13px;border-radius:999px;border:2px solid var(--edge);background:var(--panel);padding:0;cursor:pointer;transition:width .3s,background .3s}
.dot.cur{width:32px;background:var(--orange)}
.count{font-weight:800;background:var(--panel);border:3px solid var(--edge);border-radius:999px;padding:2px 12px;font-variant-numeric:tabular-nums}
@media (max-width:560px){.dots{display:none}.navbtn .t{display:none}}
@media (min-width:561px){.count{display:none}}

/* depth meter */
.meter{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);height:min(64%,380px);width:100px;display:none}
@media (min-width:900px){.meter{display:block}}
.track{position:absolute;inset-inline-end:0;top:0;bottom:0;width:14px;border-radius:999px;border:3px solid var(--edge);background:linear-gradient(#d6f2fb,#2ab7c6 22%,#083f5e 42%,#cfa56b 50%,#a0714a 68%,#2b1e16 86%,#4a3222)}
.mlab{position:absolute;inset-inline-end:26px;transform:translateY(-50%);display:flex;align-items:center;gap:4px;font-weight:800;font-size:.85rem;background:var(--panel);border:2px solid var(--edge);border-radius:999px;padding:0 8px;white-space:nowrap}
.mk{position:absolute;inset-inline-end:-9px;width:32px;height:40px;transform:translateY(-50%);transition:top 1.4s cubic-bezier(.65,0,.25,1);animation:mkFloat 3.2s ease-in-out infinite}
@keyframes mkFloat{0%,100%{transform:translateY(-50%)}50%{transform:translateY(calc(-50% - 8px))}}

#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
#confetti i{position:absolute;top:-24px;width:10px;height:15px;border-radius:3px;animation:fall 2.6s cubic-bezier(.3,.4,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),calc(100vh + 60px)) rotate(var(--r))}}

</style>

const sfxPools={};
Object.keys(SFX).forEach(k=>{const a=new Audio(SFX[k].src); a.preload='auto'; a.volume=SFX[k].vol; sfxPools[k]=[a];});
let soundOn=true;
try{ soundOn=localStorage.getItem('noc-kids-sound')!=='off'; }catch(e){}
function playSfx(k){
  if(!soundOn||!sfxPools[k]) return;
  const cfg=SFX[k], list=sfxPools[k];
  let a=list.find(x=>x.paused||x.ended);
  if(!a){
    if(list.length>=cfg.max) a=list[0];
    else{ a=new Audio(cfg.src); a.preload='auto'; a.volume=cfg.vol; list.push(a); }
  }
  try{ a.currentTime=0; }catch(e){}
  const p=a.play(); if(p&&p.catch) p.catch(()=>{});
}
function updateSound(){
  const b=$('#snd'); if(!b) return;
  b.textContent=soundOn?'🔊':'🔇';
  b.setAttribute('aria-pressed',String(soundOn));
  b.setAttribute('aria-label',tr(soundOn?'snd_off':'snd_on'));
}
/* phase loops (drilling, oil lift, ship) */
const LOOPS={
  drill:{src:'drill.mp3', vol:.3},
  suck:{src:'suck.mp3', vol:.45},
  ship:{src:'ship.mp3', vol:.28},
  heli:{src:'gd_salman-helicopter-ambience-353004.mp3', vol:.22}
};
const loopNodes={};
function loopSet(k,on){
  const cfg=LOOPS[k]; if(!cfg) return;
  let a=loopNodes[k];
  if(!on||!soundOn){
    if(a&&!a.paused){ try{a.pause();}catch(e){} try{a.currentTime=0;}catch(e){} }
    return;
  }
  if(!a){ a=new Audio(cfg.src); a.preload='auto'; a.loop=true; a.volume=cfg.vol; loopNodes[k]=a; }
  if(a.paused&&!a._fail){
    const p=a.play();
    if(p&&p.catch) p.catch(()=>{a._fail=true; setTimeout(()=>{a._fail=false;},1500);});
  }
}

const SHIP={gap:4000, fadeIn:600, fadeOut:800, node:null, on:false, fade:0, t1:0, t2:0};
function shipNode(){ if(!SHIP.node){ const a=new Audio(LOOPS.ship.src); a.preload='auto'; SHIP.node=a; } return SHIP.node; }
function shipRamp(to,ms,after){
  const a=shipNode(), from=a.volume, t0=performance.now();
  cancelAnimationFrame(SHIP.fade);
  const step=t=>{ const k=Math.min(1,(t-t0)/ms); a.volume=from+(to-from)*k; if(k<1) SHIP.fade=requestAnimationFrame(step); else if(after) after(); };
  SHIP.fade=requestAnimationFrame(step);
}
function shipPlayOne(a,afterEnd){
  try{ a.currentTime=0; }catch(e){}
  a.volume=0;
  const p=a.play(); if(p&&p.catch) p.catch(()=>{});
  shipRamp(LOOPS.ship.vol,SHIP.fadeIn);
  const fadeOut=()=>{ const dur=isFinite(a.duration)&&a.duration>0?a.duration:0;
    if(dur){ SHIP.t1=setTimeout(()=>{ if(SHIP.on) shipRamp(0,SHIP.fadeOut); },Math.max(0,dur*1000-SHIP.fadeOut)); }
    else { a.addEventListener('loadedmetadata',function once(){ a.removeEventListener('loadedmetadata',once); if(SHIP.on) fadeOut(); }); }
  };
  fadeOut();
  a.onended=()=>{ a.onended=null; if(afterEnd) afterEnd(); };
}
function shipHorn(times){
  if(!soundOn){ shipStop(); return; }
  const a=shipNode();
  clearTimeout(SHIP.t1); clearTimeout(SHIP.t2);
  cancelAnimationFrame(SHIP.fade);
  SHIP.on=true;
  let n=Math.max(1,times|0);
  const next=()=>{ if(n<=0||!SHIP.on) return; n--; shipPlayOne(a,()=>{ if(n>0&&SHIP.on) SHIP.t2=setTimeout(next,SHIP.gap); }); };
  next();
}
function shipStop(){
  SHIP.on=false;
  clearTimeout(SHIP.t1); clearTimeout(SHIP.t2);
  cancelAnimationFrame(SHIP.fade);
  const a=SHIP.node; if(!a) return;
  a.onended=null;
  if(!a.paused){ shipRamp(0,300,()=>{ try{a.pause(); a.currentTime=0;}catch(e){} }); }
  else { try{a.currentTime=0;}catch(e){} }
}

/* Plays `file`. onEnd runs only when the clip actually finishes; onFail runs when
   audio can't play (autoplay blocked, missing file, etc.) so narration can fall back. */
function playVo(file,onEnd,onFail){
  if(!soundOn||!file) return false;
  let a=voCache[file];
  if(!a){ a=new Audio(file+'.mp3'); a.preload='auto'; voCache[file]=a; }
  if(a._onEnd){ a.removeEventListener('ended',a._onEnd); a.removeEventListener('error',a._onEnd); a.removeEventListener('playing',a._onPlay); a._onEnd=null; }
  stopVo();
  narrAudio=a;
  let started=false, settled=false;
  const cleanup=()=>{ a.removeEventListener('ended',end); a.removeEventListener('error',fail); a.removeEventListener('playing',mark); a._onEnd=null; };
  const end=()=>{ if(settled) return; settled=true; cleanup(); if(onEnd) onEnd(); };
  const fail=()=>{ if(settled||started) return; settled=true; voBlocked=true; cleanup(); if(onFail) onFail(); };
  const mark=()=>{ started=true; voStartedOnce=true; };
  a._onEnd=end; a._onPlay=mark;
  a.addEventListener('ended',end);
  a.addEventListener('error',fail);
  a.addEventListener('playing',mark);
  try{ a.currentTime=0; }catch(e){}
  const p=a.play();
  if(p&&p.catch) p.catch(fail);
  narrTimers.push(setTimeout(()=>{ if(!started) fail(); },6000));

function setQatraHighlight(el){

  el.classList.add('qatrah');

/* Rects of all rendered text in a slide (so Qatra can avoid covering any of it). */
function qatraTextRects(box){
  const out=[];
  const walk=document.createTreeWalker(box,NodeFilter.SHOW_TEXT,null);
  let n;
  while((n=walk.nextNode())){
    if(!n.nodeValue||!n.nodeValue.trim()) continue;
    const pe=n.parentElement; if(!pe||(pe.closest&&pe.closest('.qhost'))) continue;
    const cs=getComputedStyle(pe);
    if(cs.visibility==='hidden'||cs.display==='none'||cs.opacity==='0') continue;
    try{
      const rg=document.createRange(); rg.selectNodeContents(n);
      const rs=rg.getClientRects();
      for(let j=0;j<rs.length;j++){ const r=rs[j]; if(r.width>1&&r.height>1) out.push(r); }
    }catch(e){}
  }
  return out;
}
/* Tight bounding box of the actual glyphs of one element (falls back to its box). */
function qatraGlyphRect(el){
  const rs=qatraTextRects(el);
  if(!rs.length){ const r=el.getBoundingClientRect(); return r.width>1?r:null; }
  let l=Infinity,t=Infinity,r2=-Infinity,b=-Infinity;
  rs.forEach(r=>{ l=Math.min(l,r.left); t=Math.min(t,r.top); r2=Math.max(r2,r.right); b=Math.max(b,r.bottom); });
  return {left:l,top:t,right:r2,bottom:b,width:r2-l,height:b-t};
}
function qatraOverlap(r,rects){
  let a=0;
  for(let j=0;j<rects.length;j++){
    const t=rects[j];
    const w=Math.min(r.right,t.right)-Math.max(r.left,t.left); if(w<=0) continue;
    const h=Math.min(r.bottom,t.bottom)-Math.max(r.top,t.top); if(h>0) a+=w*h;
  }
  return a;
}
/* Put Qatra right beside the sentence she is saying: try the free side of the glyph box,
   score candidates by how much text they would cover, then pick the cleanest one. */
function placeQatra(i,k,animate){
  const host=narrHosts[i]; if(!host) return;
  const list=SAY_ANCHORS[i]; if(!list) return;
  const sel=list[k]; if(!sel) return;
  let target=null;
  try{ target=slides[i].querySelector(sel); }catch(e){}
  if(!target) return;
  const anchor=host.offsetParent||host.parentElement; if(!anchor) return;
  const gr=qatraGlyphRect(target), sl=slides[i].getBoundingClientRect(), ar=anchor.getBoundingClientRect();
  if(!gr) return;
  const qw=host.offsetWidth||60, qh=host.offsetHeight||80, gap=14;
  const rtl=(lang==='ar');
  const rects=qatraTextRects(slides[i]);
  const cands=[
    {x:gr.right+gap,        y:gr.top+gr.height/2-qh/2, mode:'right',  p:rtl?1:0},
    {x:gr.left-qw-gap,      y:gr.top+gr.height/2-qh/2, mode:'left',   p:rtl?0:1},
    {x:gr.right-qw,         y:gr.top-qh-gap,           mode:'above',  p:2},
    {x:gr.right-qw,         y:gr.bottom+gap,           mode:'below',  p:3}
  ];
  let best=null;
  cands.forEach(c=>{
    const x=Math.max(sl.left+6,Math.min(c.x,sl.right-qw-6));
    const y=Math.max(sl.top+6,Math.min(c.y,sl.bottom-qh-6));
    const score=qatraOverlap({left:x,top:y,right:x+qw,bottom:y+qh},rects)+c.p*400;
    if(!best||score<best.score) best={score:score,x:x,y:y,mode:c.mode};
  });
  if(!best) return;
  const anim=(animate!==false);
  if(!anim) host.style.transition='none';
  host.style.left=(best.x-ar.left)+'px';
  host.style.top=(best.y-ar.top)+'px';
  host.style.right='auto'; host.style.bottom='auto'; host.style.transform='none';
  if(!anim){ void host.offsetWidth; host.style.transition=''; }
  if(anim) setQatraHighlight(target);
  const bub=narrBubbles[i];
  if(bub){
    bub.classList.remove('br','bl','bc','sd','bt');
    const below=(best.mode==='below')||(best.y-sl.top<120); /* no room above: bubble goes under her */
    bub.classList.add(below?'bt':((best.mode==='left')===(!rtl)?'br':'bl'));
  }

}
function narrate(i){
  stopNarration();
  const host=narrHosts[i], svg=narrSvgs[i], line=narrLines[i], bubble=narrBubbles[i];
  const v=T['say'+i]; if(!host||!line||!bubble||!v) return;
  const lines=v[lang==='ar'?1:0]||[]; if(!lines.length) return;
  let k=0;
  const titleAuto=(i===0); /* gated title slide: half-time gaps, then auto-advance */
  /* generous pauses so kids can digest each sentence before the next one */
  const GAP=titleAuto?2600:5600, RESTART=16000, AUTO_ADVANCE=2600;
  /* stop the mouth when the clip ends, but keep the bubble text up through the pause */
  const stopMouth=()=>{ host.classList.remove('speaking'); if(svg) svg.classList.remove('speaking'); };
  const step=()=>{
    line.textContent=lines[k];
    stopVo();
    placeQatra(i,k);
    bubble.classList.remove('on'); void bubble.offsetWidth; bubble.classList.add('on');
    host.classList.add('speaking'); if(svg) svg.classList.add('speaking');
    const next=()=>{
      k=(k+1)%lines.length;
      if(titleAuto && k===0){ titleDone=true; narrTimers.push(setTimeout(()=>go(1),AUTO_ADVANCE)); return; }
      if(i===0 && titleRun && k===0) titleDone=true;
      narrTimers.push(setTimeout(step,k===0?RESTART:GAP));
    };
    const endLine=()=>{ stopMouth(); next(); };
    const map=lang==='ar'?VO_AR:VO_EN;
    const file=map[i]?map[i][k]:null;
    if(!playVo(file,endLine,()=>narrTimers.push(setTimeout(endLine,NARR_HOLD)))) narrTimers.push(setTimeout(endLine,NARR_HOLD));
  };
  step();
}
function narrateSoon(i){
  stopNarration();
  if(i===0 && !titleRun) return; /* wait for Start/Next on the title slide */
  if(narrHosts[i]) narrTimers.push(setTimeout(()=>narrate(i),NARR_DELAY));
}

let langBusy=false;
function toggleLang(){
  const next=lang==='ar'?'en':'ar'; if(next===lang||langBusy) return;
  const app=document.querySelector('.app');
  const commit=()=>{ lang=next; try{localStorage.setItem('noc-kids-lang',lang);}catch(e){} applyLang(); };
  if(!app||reduced){ commit(); return; }
  langBusy=true;
  let done=false, timer=0;
  const finish=()=>{
    if(done) return; done=true;
    app.removeEventListener('transitionend',onEnd); clearTimeout(timer);
    commit();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ app.classList.remove('swap'); langBusy=false; }));
  };
  const onEnd=e=>{ if(e.target===app&&e.propertyName==='opacity') finish(); };
  app.addEventListener('transitionend',onEnd);

}

function dgInput(clientX){
  if(DG.phase!=='drill'&&DG.phase!=='lift') return;
  const r=dgEls.slider.getBoundingClientRect(),max=Math.max(40,r.width-52);
  DG.v=dgClamp((clientX-r.left-26)/max,0,1);
  DG.target=Math.max(DG.target,DG.v);
  dgPaint();
}
dgEls.slider.addEventListener('pointerdown',function(e){
  if(dgEls.slider.classList.contains('locked'))return;
  e.preventDefault();dgDrag=true;dgEls.slider.classList.add('dragging');
  try{dgEls.slider.setPointerCapture(e.pointerId);}catch(err){}
  dgInput(e.clientX);
});
dgEls.slider.addEventListener('pointermove',function(e){if(!dgDrag)return;e.preventDefault();dgInput(e.clientX);});
function dgPointerUp(e){if(!dgDrag)return;dgDrag=false;dgEls.slider.classList.remove('dragging');try{dgEls.slider.releasePointerCapture(e.pointerId);}catch(err){}}
dgEls.slider.addEventListener('pointerup',dgPointerUp);
dgEls.slider.addEventListener('pointercancel',dgPointerUp);
dgEls.slider.addEventListener('keydown',function(e){
  if(DG.phase!=='drill'&&DG.phase!=='lift')return;
  let v=DG.v,used=true;
  if(e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='PageUp')v=DG.v+0.1;
  else if(e.key==='ArrowLeft'||e.key==='ArrowDown'||e.key==='PageDown')v=DG.v-0.1;
  else if(e.key==='Home')v=0;
  else if(e.key==='End')v=1;
  else if(e.key===' '||e.key==='Enter')v=DG.v+0.2;
  else used=false;
  if(!used)return;
  e.preventDefault();
  DG.v=dgClamp(v,0,1);DG.target=Math.max(DG.target,DG.v);dgPaint();
});
['touchstart','touchmove','touchend','touchcancel'].forEach(function(t){
  dgEls.slider.addEventListener(t,function(e){e.stopPropagation();},{passive:true});
});
function dgStartFlow(){
  DG.phase='drill';DG.phaseT=0;DG.ready=0;DG.readyShown=false;
  dgCam(DG_REG.drill);
  dgSliderSet(true);
  dgChips(0,0);
  dgPrompt('dg_p_pull');
  dgFoot('dg_pull');
  dgGauge('dg_depth','0','m');
  dgEls.labels.classList.add('on');
}
function dgHardReset(){
  dgHideBanner();
  loopStopAll();
  DG.drillP=0;DG.liftP=0;DG.shipX=820;DG.sink=0;DG.sinkGoal=0;DG.acc=0;DG.shipFlip=1;
  DG.ready=0;DG.readyShown=false;DG.sailWait=0;
  DG.kickT=0;DG.hitSeabed=false;DG.hitRock=false;
  dgEls.depthTag.setAttribute('opacity','0');
  DG.heli.mode='parked';DG.heli.x=220;DG.heli.y=106;DG.heli.rotor=0;DG.heli.sx=1;DG.heli.sxApplied=1;
  dgEls.heliBody.setAttribute('transform','');
  dgEls.heliTxt.setAttribute('transform','');
  dgBuildFlow();
  dgBit(DG_BIT_TOP);dgOilColumn(0);dgTanks(0,0);dgFlowBits(0);dgCargoFill(0);
  dgEls.resGlow.setAttribute('opacity','0');
  dgEls.gasLbl.setAttribute('opacity','0');dgEls.oilLbl.setAttribute('opacity','0');
  dgEls.ship.setAttribute('opacity','0');dgEls.wake.setAttribute('opacity','0');
  dgEls.ship.setAttribute('transform',dgShipTransform());
  dgEls.hose.classList.remove('on');
  dgEls.ship.classList.remove('sailing');
  dgEls.refLabel.classList.remove('on');
  dgEls.bitGlow.setAttribute('opacity','0');
  dgEls.world.classList.remove('drilling','lifting');
  dgEls.ripple.classList.add('off');
  dgStartFlow();
}
function dgFound(){
  DG.phase='found';DG.phaseT=0;
  dgEls.depthTag.setAttribute('opacity','0');
  dgEls.resGlow.setAttribute('opacity','.85');
  dgEls.gasLbl.setAttribute('opacity','1');
  dgEls.oilLbl.setAttribute('opacity','1');
  dgChips(1,1);
  dgPrompt('dg_p_found');
  dgEls.labels.classList.add('on');
  dgSliderSet(false);
  dgCam(DG_REG.found);
  dgGauge('dg_depth','500','m');
  playSfx('sparkle');
  dgBurst(320,470,'spark',20);
  dgBurst(320,486,'bubble',8);
  dgBanner('dg_b_found','dg_b_found_cta',dgToLift);
}
function dgToLift(){
  dgHideBanner();
  DG.phase='lift';DG.phaseT=0;DG.liftP=0;
  dgSliderSet(true);
  dgChips(2,2);
  dgPrompt('dg_p_lift');
  dgFoot('dg_pull2');
  dgEls.labels.classList.add('on');
  dgCam(DG_REG.lift);
  dgGauge('dg_rising','0','%');
}
function dgLoadStart(){
  DG.phase='load';DG.phaseT=0;DG.ready=0;DG.readyShown=false;DG.sailWait=0;
  DG.sink=0;DG.sinkGoal=0;
  dgSliderSet(false);
  dgEls.world.classList.remove('lifting');
  dgEls.ripple.classList.add('off');
  dgChips(3,3);
  dgPrompt('dg_p_load');
  dgFoot('');
  dgEls.labels.classList.remove('on');
  dgCam(DG_REG.load);
  dgGauge('dg_loading','0','%');
  DG.shipX=820;
  DG.shipFlip=-1;
  dgEls.ship.classList.remove('sailing');
  dgEls.ship.setAttribute('opacity','1');
  dgEls.ship.setAttribute('transform',dgShipTransform());
  dgEls.wake.setAttribute('opacity','1');
  dgEls.hose.classList.remove('on');
  dgEls.refLabel.classList.remove('on');
  dgCargoFill(0);
  shipHorn(1); /* the tanker is coming in */
  playSfx('sparkle');
}
function dgSail(){
  dgHideBanner();
  DG.phase='sail';DG.phaseT=0;
  dgChips(4,4);
  dgPrompt('dg_p_sail');
  dgFoot('');
  dgGaugeHide();
  dgEls.hose.classList.remove('on');
  dgEls.wake.setAttribute('opacity','1');
  dgEls.ship.classList.add('sailing');
  dgEls.refLabel.classList.add('on');
  DG.heli.mode='follow';
  DG.shipFlip=1;
  DG.sinkGoal=0;
  shipHorn(2); /* setting sail: twice */
  playSfx('whoosh');
}
function dgDone(){
  DG.phase='done';DG.phaseT=0;
  dgChips(5,-1);
  dgPrompt('dg_p_done');
  dgEls.labels.classList.remove('on');
  dgBanner('dg_b_done','dg_again',dgHardReset);
  DG.heli.mode='home';
  playSfx('win');
  confetti(70);
}
function dgUpdate(dt){
  DG.t+=dt;
  DG.drilling=false;DG.lifting=false;
  const k=Math.min(1,dt*4.2);
  DG_CAM.x+=(DG_CAMT.x-DG_CAM.x)*k;
  DG_CAM.y+=(DG_CAMT.y-DG_CAM.y)*k;
  DG_CAM.h+=(DG_CAMT.h-DG_CAM.h)*k;
  dgView();
  dgEls.wave1.setAttribute('d',dgWavePath(170,3,DG.t*1.4));
  dgEls.wave2.setAttribute('d',dgWavePath(174,2.2,DG.t*1.9+2));
  dgEls.waveA.setAttribute('d',dgWavePath(170,4,DG.t*1.4)+' L 1780 300 L -900 300 Z');
  dgEls.waveB.setAttribute('d',dgWavePath(173,5.5,DG.t*1.1+3)+' L 1780 330 L -900 330 Z');
  if(DG.phase==='drill'){
    let moving=false;
    DG.kickT=Math.max(0,DG.kickT-dt);
    if(DG.drillP<DG.target){DG.drillP=Math.min(DG.target,DG.drillP+dt*0.55);moving=true;}
    DG.drilling=moving;
    const by=dgLerp(DG_BIT_TOP,DG_BIT_BOT,DG.drillP);
    if(!DG.hitSeabed&&by>362){DG.hitSeabed=true;DG.kickT=0.5;dgBurst(320,362,'dust',12);}
    if(!DG.hitRock&&by>396){DG.hitRock=true;DG.kickT=0.3;dgBurst(320,396,'spark',8);}
    dgBit(by);
    dgGauge('dg_depth',String(Math.round(DG.drillP*500)),'m');
    dgEls.world.classList.toggle('drilling',moving);
    dgEls.world.classList.remove('lifting');
    dgEls.ripple.classList.add('off');
    if(moving){
      DG.acc+=dt;
      if(DG.acc>0.09){DG.acc=0;dgDrillFX(by);}
      if(DG.drillP>0.05) dgPrompt('dg_p_drilling');
    }
    if(DG.drillP>=0.995){DG.drillP=1;dgBit(DG_BIT_BOT);dgEls.world.classList.remove('drilling');dgFound();}
  } else if(DG.phase==='found'){
    DG.phaseT+=dt;
    dgEls.world.classList.remove('lifting');
    dgEls.ripple.classList.add('off');
    if(DG.phaseT>7&&DG.bannerCb) dgToLift();
  } else if(DG.phase==='lift'){
    let moving=false;
    if(DG.liftP<DG.target){DG.liftP=Math.min(DG.target,DG.liftP+dt*0.5);moving=true;}
    DG.lifting=moving;
    const t=DG.liftP;
    const riseT=dgClamp(t/0.78,0,1);
    const fillT=dgClamp((t-0.78)/0.22,0,1);
    dgOilColumn(riseT);
    dgFlowBits(riseT);
    dgTanks(fillT,fillT*0.92);
    dgGauge('dg_rising',String(Math.round(t*100)),'%');
    dgEls.world.classList.toggle('lifting',moving);
    dgEls.ripple.classList.toggle('off',!(riseT>0.02&&riseT<0.98));
    if(fillT<=0.001){
      const colTop=dgLerp(DG_COL_BOT,DG_COL_TOP,riseT);
      DG_CAMT.x=320;
      DG_CAMT.y=dgClamp(colTop-30,210,470);
      DG_CAMT.h=300;
    } else {
      DG_CAMT.x=400;DG_CAMT.y=92;DG_CAMT.h=190;
    }
    if(moving){
      DG.acc+=dt;
      const colTop=dgLerp(DG_COL_BOT,DG_COL_TOP,riseT);
      if(DG.acc>0.08){
        DG.acc=0;
        if(Math.abs(colTop-170)<30) dgSpawn('foam',320+(Math.random()*2-1)*16,170,{r:3+Math.random()*4,fill:'#FFFFFF',op:.5,vy:-12,vx:(Math.random()*2-1)*20,grow:1,max:1.1+Math.random()});
        if(riseT>0.05&&riseT<0.98) dgSpawn('bubble',320+(Math.random()*2-1)*6,colTop+8,{r:1.6+Math.random()*2,vy:-30-Math.random()*24,vx:(Math.random()*2-1)*10,max:.8+Math.random()*.6,op:.8});
        if(fillT>0.02) dgSpawn('spark',392+(Math.random()*2-1)*10,64+Math.random()*30,{r:1.4+Math.random()*1.4,vx:(Math.random()*2-1)*14,vy:-14-Math.random()*14,max:.5+Math.random()*.4});
      }
      if(t>0.15) dgPrompt('dg_p_rising');
    }
    if(DG.liftP>=0.995){DG.liftP=1;dgOilColumn(1);dgFlowBits(1);dgTanks(1,0.92);dgLoadStart();}
  } else if(DG.phase==='load'){
    DG.phaseT+=dt;
    if(DG.phaseT>=0.7&&DG.phaseT<3.2){
      const p=dgClamp((DG.phaseT-0.7)/2.5,0,1);
      DG.shipX=dgLerp(820,436,1-Math.pow(1-p,3));
      if(Math.random()<0.3) dgSpawn('foam',DG.shipX+8,178,{r:3+Math.random()*4,fill:'#FFFFFF',op:.5,vx:-20-Math.random()*24,vy:-4,grow:1.1,max:1.2+Math.random()});
    } else if(DG.phaseT>=3.2&&DG.phaseT<3.8){
      if(!dgEls.hose.classList.contains('on')){dgEls.hose.classList.add('on');dgPrompt('dg_p_fill');}
    } else if(DG.phaseT>=3.8){
      const k=dgClamp((DG.phaseT-3.8)/3,0,1);
      dgEls.hose.classList.add('on');
      dgCargoFill(k);
      dgTanks(1-k,(1-k)*0.92);
      DG.sinkGoal=k*6;
      dgGauge('dg_loading',String(Math.round(k*100)),'%');
      if(Math.random()<0.28) dgSpawn('foam',DG.shipX+10+Math.random()*118,178,{r:3+Math.random()*4,fill:'#FFFFFF',op:.45,vx:-16-Math.random()*20,vy:-3,grow:1.1,max:1.2+Math.random()});
      if(Math.random()<0.22) dgSpawn('spark',509+(Math.random()*2-1)*8,166+(Math.random()*2-1)*4,{r:1.2+Math.random()*1.2,vx:(Math.random()*2-1)*10,vy:-10-Math.random()*10,max:.5+Math.random()*.4});
      if(DG.heli.mode!=='toShip'&&DG.heli.mode!=='follow') DG.heli.mode='toShip';
      if(k>=1){
        if(!DG.readyShown){DG.readyShown=true;dgBanner('dg_b_ready','dg_sail',dgSail);}
        DG.sailWait+=dt;
        if(DG.sailWait>5.5) dgSail();
      }
    }
    DG.sink+=(DG.sinkGoal-DG.sink)*Math.min(1,dt*2.2);
  } else if(DG.phase==='sail'){
    DG.phaseT+=dt;
    const p=Math.min(1,DG.phaseT/10);
    DG.shipX=dgLerp(436,1340,dgEase(p));
    if(Math.random()<0.3) dgSpawn('foam',DG.shipX-4,182,{r:3+Math.random()*4,fill:'#FFFFFF',op:.5,vx:-24-Math.random()*24,vy:-3,grow:1.2,max:1.2+Math.random()});
    DG_CAMT.x=dgClamp(DG.shipX+70,430,1370);DG_CAMT.y=150;DG_CAMT.h=300;
    DG.sink+=(0-DG.sink)*Math.min(1,dt*2);
    if(p>=1) dgDone();
  }
  dgEls.ship.setAttribute('transform',dgShipTransform());
  dgEls.shipBob.setAttribute('transform','translate(0 '+(Math.sin(DG.t*2.4)*1.4).toFixed(1)+')');
  dgHeliStep(dt);
  dgPartsStep(dt);
  loopSet('drill',DG.phase==='drill'&&DG.drilling);
  loopSet('suck',(DG.phase==='lift'&&DG.lifting)||(DG.phase==='load'&&DG.phaseT>=3.2&&!DG.readyShown));
  loopSet('heli',!!DG.heli.air);
  if(!soundOn||(DG.phase!=='load'&&DG.phase!=='sail')) shipStop();
}
function dgStart(){
  if(DG.running)return;
  DG.running=true;DG.last=performance.now();
  dgPaint();
}
function dgStop(){DG.running=false;loopStopAll();}
function dgSync(i){
  if(i===DG_SLIDE){if(!DG.started){DG.started=true;dgHardReset();}dgStart();}
  else dgStop();
}
function dgTick(now){
  if(DG.running){
    const dt=Math.min(0.05,Math.max(0,(now-DG.last)/1000));
    DG.last=now;
    dgUpdate(dt);
  }
  requestAnimationFrame(dgTick);
}
requestAnimationFrame(dgTick);
window.addEventListener('resize',function(){if(DG.running)dgPaint(); if(qatraCur.i>=0) placeQatra(qatraCur.i,qatraCur.k,false);});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ if(qatraCur.i>=0) placeQatra(qatraCur.i,qatraCur.k,false); });

/* controls */
$('#lang').addEventListener('click',toggleLang);
$('#reset').addEventListener('click',resetAll);
$('#snd').addEventListener('click',()=>{
  soundOn=!soundOn;
  try{ localStorage.setItem('noc-kids-sound',soundOn?'on':'off'); }catch(e){}
  updateSound(); if(soundOn) playSfx('sparkle');
});
$('#prev').addEventListener('click',()=>go(cur-1));
$('#next').addEventListener('click',advance);
$('#start').addEventListener('click',()=>go(1));
$('#redrill').addEventListener('click',runDrill);
$('#party').addEventListener('click',()=>{playSfx('win'); confetti(120);});
const fsb=$('#fs');
if(!document.fullscreenEnabled) fsb.hidden=true;
function fsToggle(){try{ if(document.fullscreenElement) document.exitFullscreen(); else { const p=document.documentElement.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); } }catch(e){}}
fsb.addEventListener('click',fsToggle);

document.addEventListener('keydown',e=>{
  const rtl=lang==='ar', onBtn=e.target&&e.target.closest&&e.target.closest('button');
  if(e.key==='ArrowRight'){ if(rtl) go(cur-1); else advance(); }
  else if(e.key==='ArrowLeft'){ if(rtl) advance(); else go(cur-1); }
  else if(e.key==='PageDown'||(e.key===' '&&!onBtn)){e.preventDefault(); advance();}
  else if(e.key==='f'||e.key==='F') fsToggle();
  else if(e.key==='r'||e.key==='R') resetAll();
  else if(e.key==='PageUp') go(cur-1);
  else if(e.key==='Home') go(0);
  else if(e.key==='End') go(last);
  else if(e.key==='l'||e.key==='L') toggleLang();
});
let tx=0, ty=0; const stage=$('.stage');
stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0]; tx=t.clientX; ty=t.clientY;},{passive:true});
stage.addEventListener('touchend',e=>{const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty; if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){const fwd=lang==='ar'?dx>0:dx<0; if(fwd) advance(); else go(cur-1);}},{passive:true});

buildNarration();
applyLang();
go(0);
})();
</script>
